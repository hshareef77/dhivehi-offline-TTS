name: Clean Up Old APK Files
# Frees GitHub Actions storage (shared by all private repositories on the account)
# by deleting old build files: APKs and test reports. Source code is never touched.
on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: Keep files newer than this many days (0 deletes all old build files)
        type: number
        default: 0
  schedule:
    - cron: '41 3 * * *' # Every day: delete build files older than 24 hours.
permissions:
  actions: write
concurrency:
  group: artifact-cleanup
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const keepDays = context.eventName === 'schedule' ? 1 : Number('${{ inputs.keep_days }}' || 0);
            const cutoff = Date.now() - keepDays * 24 * 60 * 60 * 1000;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            let deleted = 0, bytes = 0, kept = 0;
            for (const a of artifacts) {
              if (new Date(a.created_at).getTime() >= cutoff) { kept++; continue; }
              try {
                await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
                deleted++; bytes += a.size_in_bytes;
              } catch (e) { core.warning(`Could not delete ${a.name} (${a.id}): ${e.message}`); }
            }
            const mb = (bytes / 1048576).toFixed(0);
            core.notice(`Deleted ${deleted} old build files (${mb} MB). Kept ${kept}. GitHub recounts storage within 6-12 hours.`);
            await core.summary.addRaw(`Deleted ${deleted} old build files (${mb} MB). Kept ${kept} newer files.`).write();
