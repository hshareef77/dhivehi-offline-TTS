name: Android APK build and pronunciation tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_engine:
        description: 'Compile actual OpenEVV JNI engine from upstream source for private evaluation'
        type: boolean
        default: false
      publish_preview:
        description: 'Publish signed preview APK to GitHub Releases after tests pass'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare native Eloquence source only for explicit manual builds
        if: github.event_name == 'workflow_dispatch' && inputs.native_engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/trypsynth/evvdroid.git /tmp/native-source
          # Restore the complete engine tree only in the runner's ephemeral
          # checkout. IBM-derived voice assets are not committed to GitHub.
          rsync -a /tmp/native-source/native/openevv/ third_party/eloquence-reference/native/openevv/
          test -f third_party/eloquence-reference/native/openevv/lang/enus/rom.txt || \
            test -d third_party/eloquence-reference/native/openevv/lang/enus
          echo 'Native source prepared for this ephemeral build.'
      - name: Install NDK for explicit native compilation
        if: github.event_name == 'workflow_dispatch' && inputs.native_engine
        shell: bash
        run: |
          yes | sdkmanager --install 'ndk;26.1.10909125' || true
          test -x "${ANDROID_SDK_ROOT}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - name: Set native build mode
        if: github.event_name == 'workflow_dispatch' && inputs.native_engine
        run: echo "NATIVE_BUILD_ARGS=-PnativeEloquence=true" >> "$GITHUB_ENV"
      - name: Check Dhivehi pronunciation and WAV parser
        run: gradle :app:testDebugUnitTest --stacktrace ${NATIVE_BUILD_ARGS:-}
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace ${NATIVE_BUILD_ARGS:-}
      - uses: actions/upload-artifact@v4
        with:
          name: dhivehi-phonetic-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Configure permanent Android release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'No complete release signing secrets found. Skipping signed APK.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/haluvi-release-keystore.p12"
          chmod 600 "$RUNNER_TEMP/haluvi-release-keystore.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/haluvi-release-keystore.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: gradle :app:assembleRelease --stacktrace ${NATIVE_BUILD_ARGS:-}
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: dhivehi-phonetic-lab-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish signed preview APK only on explicit manual request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && !inputs.native_engine && steps.signing.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.3.0-preview-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "dhivehi-tts-${TAG}.apk"
          gh release create "${TAG}" "dhivehi-tts-${TAG}.apk" \
            --title "Dhivehi TTS phonetic preview ${TAG}" \
            --notes "Personal testing only: experimental phonetic wrapper. Requires another installed offline TTS engine. Native Eloquence voice is not bundled; Dhivehi pronunciation is not verified. Keep existing screen-reader voice available." \
            --prerelease \
            --target "${GITHUB_SHA}"
