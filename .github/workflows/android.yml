name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Speech engine unit tests (JVM)
        run: gradle -p engine test --stacktrace
      - name: Build debug APK
        env:
          # increasing version code so each APK installs over the previous one
          VERSION_CODE: ${{ github.run_number }}0
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "dhivehi-offline-tts-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dhivehi-offline-tts-apk
          path: dhivehi-offline-tts-*.apk
          if-no-files-found: error
