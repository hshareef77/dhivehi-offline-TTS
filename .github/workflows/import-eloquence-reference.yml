name: Import redistributable Eloquence source reference
on:
  push:
    paths:
      - .github/workflows/import-eloquence-reference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch public upstream and inspect licenses
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/trypsynth/evvdroid.git /tmp/evvdroid
          test -f /tmp/evvdroid/LICENSE
          test -f /tmp/evvdroid/native/openevv/NOTICE
          mkdir -p third_party/eloquence-reference
          # Reference implementation only. Not part of the current Android build.
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' \
            --exclude='release.jks' --exclude='*.jks' --exclude='*.keystore' \
            --exclude='*.p12' --exclude='*.pfx' --exclude='*.pem' --exclude='*.key' \
            --exclude='lang/' --exclude='reference/' \
            --exclude='klatt_tables.c' --exclude='eci_xmltok_tables.c' \
            --exclude='speak.wav' --exclude='*.so' --exclude='*.a' --exclude='*.o' \
            --exclude='*.jar' --exclude='gradle/wrapper/gradle-wrapper.jar' \
            --exclude='build/' --exclude='.gradle/' --exclude='__pycache__/' \
            /tmp/evvdroid/ third_party/eloquence-reference/
          # Do not import upstream Gradle release signing settings.
          rm -f third_party/eloquence-reference/app/build.gradle.kts
          rm -f third_party/eloquence-reference/.gitmodules
          cat > third_party/eloquence-reference/IMPORT_NOTICE.md <<'NOTE'
          # Eloquence/OpenEVV reference source
          Imported from https://github.com/trypsynth/evvdroid by GitHub Actions.
          This is a **reference snapshot from public upstream**, not a byte-for-byte import
          of the user's supplied ZIP. See LICENSE and native/openevv/NOTICE.

          The upstream IBM-derived language data under native/openevv/lang,
          proprietary-derived tables, binary artifacts, and bundled release signing
          keystore have deliberately NOT been imported. As a result, this directory
          cannot be built into a working Eloquence voice as-is.

          Its source is retained for inspection and adaptation of the Android TTS service,
          JNI bridge, text preprocessing, and engine infrastructure. Public redistribution
          of IBM language/voice data requires separate permission.
          NOTE
          git add third_party/eloquence-reference
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import licensable Eloquence reference source without IBM voice assets"
            git push origin HEAD:main
          fi
