name: Check Dhivehi F5 model
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/f5/check_model.py'
      - '.github/workflows/check-f5-model.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: f5-model-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      F5_WORK: /mnt/f5-work
      PIP_NO_CACHE_DIR: '1'
      HF_XET_CHUNK_CACHE_SIZE_BYTES: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check saved access token
        run: test -n "$HF_TOKEN" || { echo "::error::HF_TOKEN is missing"; exit 1; }
      - name: Prepare storage
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$F5_WORK"
          sudo chown "$USER" "$F5_WORK"
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/f5-swap
          sudo chmod 600 /mnt/f5-swap
          sudo mkswap /mnt/f5-swap
          sudo swapon /mnt/f5-swap
          df -h / /mnt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official CPU inference tools
        run: |
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'f5-tts @ git+https://github.com/SWivid/F5-TTS.git@600e5fdfbf319f84735557aca80a7aaf60d487e6' 'transformers==4.57.1'
          pip freeze > f5-environment.txt
      - name: Download, strictly load, and test the real F5 model
        run: python tools/f5/check_model.py
      - name: Collect environment details
        if: always()
        run: |
          mkdir -p f5-report
          cp f5-environment.txt f5-report/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f5-model-check
          path: f5-report/
          if-no-files-found: error
